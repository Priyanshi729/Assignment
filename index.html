<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="container">
    <div class="sidebar">
      <div id="top">
        <img src="images/Union.svg" class="logo">
        <div class="user-details">
          <div class="user">
            <div id="user-logo">
              <img src="images/Group 79 (1).svg" alt="logo">
            </div>
            <div class="user-info">
              <span class="user-name">Jessica Thomson</span>
              <span class="user-role">Primary User</span>
            </div>
          </div>
          <div id="user-drop">
            <button class="drop-button"><img src="images/Icon Right.svg" alt="drop"></button>
            <div class="user-log">
              <button class="log-button">Logout</button>
            </div>
          </div>
        </div>
        <div class="menu">
          <a href="#" class="menu-item"><img src="images/home 1.svg" class="menu-icon">Home</a>
          <div id="menu-item-wrapper">
            <a href="#" class="menu-item"><img src="images/file-text 1.svg" class="menu-icon">Documents</a>
          </div>
          <a href="#" class="menu-item"><img src="images/message-circle 1.svg" class="menu-icon">Chat with Neptune</a>
          <a href="#" class="menu-item"><img src="images/help-circle 1.svg" class="menu-icon">Help</a>
          <a href="#" class="menu-item"><img src="images/settings 1.svg" class="menu-icon">Settings</a>
        </div>
      </div>
      <div id="bottom">
        <div class="contact-us">
          <img src="images/phone 1.svg" alt="phone">
        </div>
        <div class="text">
          <p class="text-1">Having trouble?</p>
          <p class="text-2">Feel free to contact us and we will always help you through the process.</p>
        </div>
        <div class="button">
          <button class="button-c">Contact us</button>
        </div>
      </div>
    </div>
    <div class="main">
      <div id="right">
        <div class="items">
          <span class="home">Home</span>
          <span class="sign">></span>
          <span class="documents">Documents</span>
        </div>
        <div class="top-bottom">
          <div class="heading">
            <p>My Documents</p>
          </div>
          <div class="right-bottom">
            <div class="add">
              <button class="add-button">Add</button>
            </div>
            <div class="search-bar">
              <input type="text" placeholder="Search documents" class="search">
              <img src="images/Vector.svg" class="search-logo">
            </div>
          </div>
        </div>
        <div id="table-content">
          <table class="doc-table">
            <thead>
              <tr>
                <th><input type="checkbox"><img src="images/Icon Right.svg" class="table-drop"></th>
                <th>DocumentName</th>
                <th>Status
                  <!-- <select class="drop-down">
                    <option>Select</option>
                    <option class="pending">Pending</option>
                    <option class="Need-signing">Need Signing</option>
                    <option class="completed">Completed</option>
                  </select> -->
                </th>
                <th>Last Modified</th>
              </tr>
            </thead>
            <tbody id="table-body">

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  </div>
  <div id="form-div" class="hidden">
    <form action="" class="form-doc" id="form-con">
      <div id="add-form">
        <p class="doc-add">Add Document</p>
        <div class="form-element">
          <div class="doc-title-in"><label for="doc-title" class="doc-form">Document Title</label>
            <input id="doc-title" type="text" placeholder="Enter document title" class="form-input">
          </div>
          <div class="doc-title-sel">
            <label for="doc-status" class="doc-form">Status</label>
            <select id="doc-status" class="form-input">
              <option disabled selected>Select Status</option>
              <option class="Need-signing">Need Signing</option>
              <option class="pending">Pending</option>
              <option class="completed">Completed</option>
            </select>
          </div>
          <div class="doc-waiting" id="waiting-field">
            <label for="waiting-count" class="doc-form">No of Persons Waiting</label>
            <input type="number" id="waiting-count" class="form-pen" min="1">
          </div>
          <div class="delete-add">
            <button type="button" class="cancel"> Cancel</button>
            <button type="submit" class="add-button">Add</button>
          </div>
        </div>
        <div>
        </div>
    </form>
  </div>
  <script src="script.js"></script>
</body>

</html>
